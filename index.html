<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OneGoodThought — one good thought is enough</title>
  <meta name="description" content="One curated affirmation, once. No list, no accounts, no streaks. Just one good thought for today.">
  <meta name="theme-color" content="#191410">
  <meta name="color-scheme" content="dark">

  <meta property="og:title" content="OneGoodThought">
  <meta property="og:description" content="One good thought is enough.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e0a458'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Literata:opsz,wght@18..144,400;18..144,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.replace('no-js','js')</script>
</head>
<body>

  <div class="ambient" aria-hidden="true"></div>

  <main class="stage">
    <p class="affirmation" id="affirmation" aria-live="polite">
      You&rsquo;re doing okay. That&rsquo;s enough for today.
    </p>

    <div class="controls" id="today-controls" hidden>
      <div class="row row-primary">
        <button class="link-btn" id="another-btn" type="button" aria-label="Show another thought">
          <span>Another</span>
        </button>
        <button class="link-btn keep" id="keep-btn" type="button" aria-pressed="false" aria-label="Keep this thought">
          <span>Keep</span>
        </button>
      </div>

      <div class="row row-review" id="review-nav" hidden>
        <button class="step-btn" id="prev-btn" type="button" aria-label="Previous kept thought">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="counter" id="counter" aria-live="polite">1 / 1</span>
        <button class="step-btn" id="next-btn" type="button" aria-label="Next kept thought">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="link-btn quiet" id="copy-btn" type="button">
          <span>Copy link</span>
        </button>
        <button class="link-btn quiet" id="done-btn" type="button">
          <span>Done</span>
        </button>
      </div>

      <button class="link-btn quiet review-entry" id="review-btn" type="button" hidden>
        <span>Kept thoughts</span>
      </button>

      <p class="note" id="link-note" hidden>
        Your kept thoughts live in this link. Save it to keep them.
      </p>
    </div>
  </main>

  <footer class="mark" aria-hidden="true">
    <span>OneGoodThought</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
